            - paragraph [ref=e54]: "Social isolation (the objective state of having few social relationships or infrequent social contact with others) and loneliness (a subjective feeling of being isolated) are serious yet underappreciated public health risks that affect a significant portion of the older adult population. Approximately one-quarter (24 percent) of community-dwelling Americans aged 65 and older are considered to be socially isolated, and a significant proportion of adults in the United States report feeling lonely (35 percent of adults aged 45 and older and 43 percent of adults aged 60 and older). While there are challenges in measuring social isolation and loneliness precisely, there is strong evidence that many older adults are socially isolated or lonely in ways that puts their health at risk. For example:"
            - list [ref=e55]:
              - listitem [ref=e56]: Social isolation has been associated with a significantly increased risk of premature mortality from all causes;
              - listitem [ref=e57]: Social isolation has been associated with an approximately 50 percent increased risk of developing dementia;
              - listitem [ref=e58]: Loneliness among heart failure patients has been associated with a nearly four times increased risk of death, 68 percent increased risk of hospitalization, and 57 percent increased risk of emergency department visits; and
              - listitem [ref=e59]: Poor social relationships (characterized by social isolation or loneliness) have been associated with a 29 percent increased risk of incident coronary heart disease and a 32 percent increased risk of stroke.
