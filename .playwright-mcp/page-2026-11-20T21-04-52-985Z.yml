            - paragraph [ref=e288]: "The committee identified three major aspects of the evidence base for effective clinical and public health interventions that need to be addressed in order to determine best practices and approaches: quality, funding, and research gaps. That is, the overall quality of the evidence base needs to be improved, adequate funding of research will be required, and research on major gaps in the current evidence base needs to be prioritized. Therefore, the committee makes the following recommendations:"
