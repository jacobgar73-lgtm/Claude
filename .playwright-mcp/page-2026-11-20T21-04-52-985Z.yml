              - generic [ref=e77] [cursor=pointer]
          - generic [ref=e80]:
            - paragraph [ref=e81]: Understanding the full scope and complexity of the influence of social relationships on health is challenging. In addition to the absolute number or extent of social relationships, the quality of such relationships is also an important factor in their impact on health. Two aspects of social relationships, social isolation and loneliness, have become increasingly prominent in the scientific literature. While both social isolation and loneliness can affect health throughout the life course, this report focuses on the health impacts of social isolation and loneliness among adults aged 50 and older. Of note, it is incorrect to assume that all older adults are isolated or lonely or that aging, independent of other factors, causes social isolation and loneliness. Rather, older adults are at increased risk for social isolation and loneliness because they are more likely to face predisposing factors such as living alone, the loss of family or friends, chronic illness, and sensory impairments. Over a life course, social isolation and loneliness may be episodic or chronic, depending on an individual’s circumstances and perceptions.
            - paragraph [ref=e82]: Many approaches have been taken to improve social connections for individuals who are socially isolated or lonely, but opportunities to intervene may be most challenging for those who are at highest risk. For example, people who do not have consistent interactions with others (e.g., have unstable housing, do not belong to any social or religious groups, or do not have significant personal relationships) may never be identified in their own communities. However, nearly all persons 50 years of age or older interact with the health care system in some way. Therefore, this report focuses on the role of the health care system as a key and relatively untapped partner in efforts to identify, prevent, and mitigate the adverse health impacts of social isolation and loneliness in older adults.
            - heading "STUDY CONTEXT AND CHARGE" [level=2] [ref=e83]
            - paragraph [ref=e84]: A systematic and rigorous science of social relationships and their consequences, especially in terms of health, emerged in the latter part of the 20th century as part of a broader recognition of the role of social determinants of health. By the beginning of the 21st century, several aspects of social relationships were being studied systematically in research and had been identified as potential influences on human health. Only recently have the adverse health effects of social isolation and loneliness received public attention nationally and internationally. For example, in January 2018, Theresa May, the prime minister of the United Kingdom, established and appointed a Minister of Loneliness to develop policies for both measuring and reducing loneliness.
            - paragraph [ref=e85]: With support from the AARP Foundation, the National Academies of Sciences, Engineering, and Medicine (the National Academies) formed the Committee on the Health and Medical Dimensions of Social Isolation and Loneliness in Older Adults in fall 2018. The committee’s charge essentially consisted of
