                - generic "10" [ref=e359]: initiate potential preventive interventions after having identified individuals who are at an elevated risk due to life events (e.g., loss of a significant relationship, geographic move, relevant health conditions).
              - list [ref=e360]:
                - listitem [ref=e361]: In the case of older adults who are currently socially isolated or lonely (or at an elevated risk for social isolation or loneliness), health care providers should discuss the adverse health outcomes associated with social isolation and loneliness with these older adults and their legally appointed representatives. Providers should make appropriate efforts to connect isolated or lonely older adults with needed social care.
                - listitem [ref=e362]: For older adults who are currently socially isolated or lonely, health care providers should attempt to determine the underlying causes and use evidence-based practices tailored to appropriately address those causes (e.g., hearing loss, mobility limitations).
            - paragraph [ref=e363]: A variety of established research tools can be used to measure social isolation and loneliness, each with its own strengths and weaknesses. Despite the limits of the evidence base concerning how best to implement these tools in clinical settings, the committee concluded that an important aspect of selecting a tool for use in clinical settings is standardization. This means that within a specific health care system or organization, all clinicians should use the same tool or set of tools; they should use only validated tools and refrain from using only parts of existing tools or creating new, unvalidated tools. While the committee recognizes that some variation in choice of appropriate tools may be necessary for assessing certain specific populations or health conditions, it emphasizes that the chosen measurement tool needs to match the research question. (That is, if assessing for loneliness, for instance, the tool needs to be validated specifically for the measurement of loneliness, as opposed to other indicators of social connection.) In spite of limitations to existing tools, their use is necessary to address social isolation and loneliness more fully in clinical settings. More effort is needed to update existing tools and to develop and validate better tools that can fully capture the experience of social isolation and loneliness among today’s older adults.
            - paragraph [ref=e364]: Additional research is needed to evaluate the ethical implications and unintended consequences of clinical assessments and also to determine specific implementation details, including
            - list [ref=e365]:
              - listitem [ref=e366]: who should receive the assessment,
              - listitem [ref=e367]: who should conduct the assessment,
              - listitem [ref=e368]: the ideal frequency of assessment for different subpopulations, and
              - listitem [ref=e369]: the appropriate interventions, referrals, and follow-up care.
            - paragraph [ref=e370]: Many initiatives to address social isolation and loneliness in clinical settings are being undertaken by individuals without formal research training.
