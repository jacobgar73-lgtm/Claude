            - 'heading "Goals 3 and 4: Improve Awareness and Strengthen Ongoing Education and Training" [level=3] [ref=e399]'
            - paragraph [ref=e400]:
              - text: Educating and training the health care workforce about addressing social isolation and loneliness will require a broad approach similar to educating the workforce to address the social determinants of health. Workforce development is needed within formal degree and postgraduate programs for health professionals, in training programs for direct care workers and community members, and in lifelong learning opportunities. It will be necessary to educate and train all members of the health care workforce, including professionals, direct care workers, community health workers, volunteers, family caregivers, and members of the larger community, such as police officers and mail carriers, who provide a broad array of services to or regularly interact with older adults.
