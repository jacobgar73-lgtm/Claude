            - paragraph [ref=e460]: "for these problems. Health professionals also need to learn how to work directly with older adults and their significant others to support and encourage ways to prevent or reduce social isolation and loneliness, including how to make and follow-up on referrals to appropriate community-based services. This will include learning to work with direct care workers, community health workers, family caregivers, and other community members as part of a team-based approach to helping older adults. Health care professionals also need to learn how to work with community partners to develop, implement, and evaluate programs for preventing or mitigating social isolation and loneliness in older adults. Competency in each of these areas will become increasingly important as systems of care are developed for preventing, assessing, and treating the negative health impacts of social isolation and loneliness in older adults. Therefore, as a first step, the committee makes the following recommendations:"
