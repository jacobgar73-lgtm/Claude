            - generic [ref=e431]:
              - paragraph [ref=e432]: "RECOMMENDATION 8-1: The U.S. Department of Health and Human Services should advocate for including measures of social isolation and loneliness in major large-scale health strategies (e.g., Healthy People) and surveys (e.g., National Health Interview Survey)."
              - paragraph [ref=e433]: "RECOMMENDATION 8-2: Health and aging organizations, relevant government agencies, and consumer-facing organizations should create public awareness and education campaigns that highlight the health impacts of social isolation and loneliness in adults."
              - list [ref=e434]:
                - listitem [ref=e435]: Health care systems, associations representing all types of health care workers (e.g., American Medical Association, American Nurses Association, American Psychological Association, National Association of Social Workers, American Geriatrics Society, American Association for Geriatric Psychiatry, organizations representing direct care workers); health-related organizations (e.g., American Heart Association); consumer-facing, health-related organizations (e.g., AARP); aging professional associations (e.g., American Society on Aging, Gerontological Society of America); aging services organizations (e.g., area agencies on aging, state departments on aging); and organizations working with at-risk older adults (e.g., National Hispanic Council on Aging) should actively communicate information about the health impacts of social isolation and loneliness through print and digital media.
                - listitem [ref=e436]: Organizations representing health plans and providers should include consumer-friendly information about the health impacts of social isolation and loneliness in their repository of patient resources (e.g., where the organization provides information about the self-management of various chronic diseases).
