            - paragraph [ref=e146]:
              - generic "4" [ref=e147]: Loneliness, by contrast, refers to the perception of social isolation or the subjective feeling of being lonely. Although those who lack social contact may feel lonely, social isolation and loneliness often are not significantly correlated. Thus, it is important to distinguish between the two states.
            - paragraph [ref=e148]:
              - text: The term “social relationships” is arguably the most common way of referring to the connections and intersections among human beings, and it derives from and is employed in broader common usage. In 1979 Berkman and Syme documented the strong association between social relationships and all-cause mortality and, hence, life expectancy, using the terms “social networks” and “social integration” to denote a broad pattern of social relationships (with both individuals and groups). Additionally, there has been much research on the concept of social support, the actual or perceived availability of resources from others. Over the past several decades there has been a new focus on loneliness as a risk factor for health. While each of these terms have been linked to important health outcomes, they are not highly correlated, suggesting that they may influence health through different mechanisms. Thus, the term “social connection” has been proposed to encompass the different conceptual and measurement approaches (see
              - link "Figure S-1" [ref=e149] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/2#frontmatter07_AHj
              - text: ). Social isolation is reflected in
              - link "Figure S-1" [ref=e150] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/2#frontmatter07_AHj
              - text: as a structural indicator of social connection while loneliness is functional indicator.
