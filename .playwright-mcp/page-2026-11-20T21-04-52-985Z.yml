            - heading "GOALS AND RECOMMENDATIONS" [level=2] [ref=e191]
            - paragraph [ref=e192]:
              - text: The committee formulated its recommendations in accordance with five goals, each of which addresses an aspect of enhancing the role of the health care system in addressing the health impacts of social isolation and loneliness in older adults (see
              - link "Box S-1" [ref=e193] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/2#frontmatter07_pAZI_
              - text: ). While not all of the recommendations are explicitly directed to clinicians or clinical settings of care, the committee identified recommendations that would be most helpful to reach the ultimate goal of developing and improving clinical interventions to mitigate the negative health impacts of social isolation and loneliness. Furthermore, the committee emphasizes that the preservation of an individual’s own decisions regarding his or her life is essential as a guiding principle for all interventions. The following sections discuss the overall goals and recommendations of this report, all of which apply to interventions in health care settings for adults aged 50 and older.
