                - listitem [ref=e328]: Trends among current younger adults as they age (e.g., use of technology, economic trends) to gain knowledge that informs future approaches to addressing social isolation and loneliness.
                - listitem [ref=e329]: Flexibility in funding to allow for the pilot testing and evaluation of innovative funding mechanisms for interventions.
                - listitem [ref=e330]: Approaches for assessments of and interventions among understudied groups of older adults (e.g., low income, lesbian, gay, bisexual, and transgender) and those who face unique barriers to health.
              - paragraph [ref=e331]: "RECOMMENDATION 9-6: System designers as well as those who are developing and deploying technology in interventions should ensure that technological innovations related to social isolation and loneliness are properly assessed and tested so as to understand their full range of benefits and potential adverse consequences in order to prevent harm, and they should work to understand and take into account contextual issues, such as broadband access and having sufficient knowledge and support for using the technology."
            - 'heading "Goal 2: Translate Current Research into Health Care Practices" [level=3] [ref=e332]'
            - paragraph [ref=e333]: Older adults are high-volume and high-frequency users of the health care system. Targeting the major social and behavioral risk factors for health offers a way to improve population health and even reduce health disparities. Health care delivery systems are exploring the feasibility and impact of using practice-based strategies to identify and address the social determinants of health, including social isolation and loneliness. Many intervention efforts for social isolation and loneliness focus only on community-based organizations, but given the evidence for the broad-reaching impacts of social isolation and loneliness on the health of older adults and the emerging evidence for their impacts on health care utilization, the committee concluded that the health care system is well poised to develop methods for beginning to identify social isolation and loneliness in health care settings. By first identifying those at highest risk, clinicians and health care researchers may be able to use these findings to better target meaningful clinical and public health interventions to individual patients as well as to high-need populations served by a practice or health care system. Furthermore, this will support a step-wise approach to care that includes the identification of individuals at risk, the provision of education, and ultimately, intervention.
            - paragraph [ref=e335]: "RECOMMENDATION 7-1: Health care providers and practices should periodically perform an assessment using one or more validated tools to identify older adults experiencing social isolation and loneliness in order to"
