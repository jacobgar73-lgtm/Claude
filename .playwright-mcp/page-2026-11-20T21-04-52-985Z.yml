          - generic [ref=e106]:
            - paragraph [ref=e107]:
              - generic "3" [ref=e108]:
                - text: two parts. First, the committee was charged with summarizing the evidence for how social isolation and loneliness affect health and quality of life in adults aged 50 and older, particularly among low-income, underserved, and vulnerable subpopulations (groups the committee refer to as “at-risk” populations). Second, the committee was charged with identifying and recommending opportunities specifically for clinical settings of health care to help reduce the incidence and adverse health impacts of social isolation and loneliness (such as clinical tools and methodologies, professional education, and public awareness) and to examine avenues for the dissemination of information targeted to health care practitioners.
                - superscript [ref=e109]:
                  - link "1" [ref=e110] [cursor=pointer]:
                    - /url: https://www.nationalacademies.org/read/25663/chapter/2#frontmatter07_AiI
            - paragraph [ref=e111]: While this report focuses on the role of the health care system, the committee emphasizes that the health care system alone cannot solve all of the challenges of social isolation and loneliness; rather, the health care system needs to connect with the broader public health and social care communities. Furthermore, the committee recognizes that in the larger context of addressing social isolation and loneliness, the most effective interventions may not require the participation of the health care system. However, this does not mean that the health care system should not strive to help improve the health and well-being of those who suffer the adverse health impacts of social isolation and loneliness. In fact, health care providers may be in the best position to identify individuals who are at highest risk for social isolation or loneliness—individuals for whom the health care system may be their only point of contact with their broader community. In this way, the health care system can help those individuals to connect with the most appropriate care, either inside or outside the health care system. Therefore, the health care system has the potential to be a critical component of a much larger solution.
            - heading "DEFINING ASPECTS OF SOCIAL RELATIONSHIPS" [level=2] [ref=e112]
            - paragraph [ref=e113]: The broad, interdisciplinary scientific fields that together form the modern science of social relationships have used a variety of terms—social isolation, social connection, social networks, social support, social relationships, loneliness, and so forth—to refer to related situations. There are important distinctions among these terms in what they describe or measure, but they are often erroneously used interchangeably. An individual can be isolated and not feel lonely, or can feel lonely even if he or she is not isolated. Social isolation and loneliness represent distinct phenomena. Social isolation typically refers to the objective lack of (or limited) social contact with others and is marked by a person having few social network ties, having infrequent social contact, or, potentially, living alone.
