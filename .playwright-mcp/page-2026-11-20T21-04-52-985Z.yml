            - paragraph [ref=e494]: Depending on the complexity of the knowledge to be disseminated or the evidence-based practices to be implemented, a variety of teaching strategies can be considered. As the evidence for interventions evolves, the educational and training opportunities need to expand to include new and updated evidence-based practices for preventing, assessing, and treating the negative health impacts of social isolation and loneliness.
            - 'heading "Goal 5: Strengthen Ties Between the Health Care System and Community-Based Networks and Resources" [level=3] [ref=e495]'
            - paragraph [ref=e496]: Like other social determinants of health, social isolation and loneliness are community-wide problems and some solutions will require coordinated solutions between the health care system and community-based social care providers. National, state, and local coalitions of public and private health care leaders, including minority-based community organizations, need to work collectively to develop strategies to address social isolation and loneliness in older adults.
            - paragraph [ref=e498]: "RECOMMENDATION 9-1: Health care providers, organizations, and systems should partner with social service providers, including those serving vulnerable communities, in order to create effective team-based care (which includes services such as transportation and housing support) and to promote the use of tailored community-based services to address social isolation and loneliness in older adults."
            - paragraph [ref=e499]: Many health care organizations (e.g., hospitals) are required under federal law to submit community benefit reports. Efforts by such entities to partner with social service providers could be used as an example of their community benefit. The 2019 National Academies consensus study report Integrating Social Care into the Delivery of Health Care cites the provision of transportation vouchers and the investment in community ride-sharing programs as examples of activities that can improve the integration of care. Such services could allow individuals to travel to health care appointments and to overcome individual transportation-related barriers to being more integrated into local community events, both of which could help to reduce social isolation and loneliness.
