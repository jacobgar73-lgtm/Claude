            - 'heading "Goal 1: Develop a More Robust Evidence Base" [level=3] [ref=e220]'
            - paragraph [ref=e221]: While a substantial and growing body of evidence demonstrates the health impacts of social isolation and loneliness, the evidence base for interventions for specific populations or settings is less robust. Recommendations are provided for meeting the goal of developing a more robust evidence base on effective assessment, prevention, and intervention strategies.
            - heading "Social Isolation, Loneliness, and Mortality" [level=4] [ref=e222]
            - paragraph [ref=e223]: Social isolation and loneliness are as prevalent and play as large a role in today’s society as many other well-established risk factors for health, yet limited resources and attention have been committed to better understanding social isolation and loneliness and their individual and collective impacts on health. More than four decades of research has produced robust evidence that lacking social connection—and, particularly, scoring high on measures of social isolation—is associated with a significantly increased risk for premature mortality from all causes. Furthermore, there is some evidence that the magnitude of the effect of social connection on risk for mortality may be comparable to or greater than other well-established risk factors that are widely recognized and acted on by the public health and health care systems.
            - paragraph [ref=e224]: While there is evidence that loneliness is associated with mortality, the existing evidence does not yet approach the cumulative weight of evidence for the association between social isolation and mortality. More research is needed to establish the strength and robustness of the predictive association of loneliness with mortality in relation to social isolation and to clarify how social isolation and loneliness relate to and operate with each other.
            - paragraph [ref=e226]:
              - generic [ref=e227]:
                - text: "RECOMMENDATION 2-1: Major funders of health research, including the government (e.g., the National Institutes of Health, the Center for Medicare & Medicaid Innovation, and the Patient-Centered Outcomes Research Institute), foundations, and large health plans should fund research on social isolation and loneliness at levels that reflect their associations with mortality."
                - superscript [ref=e228]:
                  - link "3" [ref=e229] [cursor=pointer]:
                    - /url: https://www.nationalacademies.org/read/25663/chapter/2#frontmatter07_pz24-9
            - heading "Risk Factors and Health Impacts" [level=4] [ref=e230]
