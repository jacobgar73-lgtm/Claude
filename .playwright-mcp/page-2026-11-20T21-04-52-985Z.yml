            - paragraph [ref=e259]: individual’s likelihood of experiencing social isolation or loneliness. Furthermore, some factors may increase the risk for social isolation and loneliness (and ultimately, result in negative health impacts) while other factors may provide protective benefits. Substantial evidence indicates that social isolation, loneliness, and other indicators of social connection have associations with major forms of physical, cognitive, and psychological morbidity; health-related behaviors; and health-related quality of life. However, the evidence for specific impacts in the at-risk populations is sparse.
            - paragraph [ref=e260]: Beyond these associations, the mechanisms by which social connection, or lack thereof, affects the development and course of disease have been elucidated by a growing evidence base. Strong evidence links social isolation, loneliness, and other indicators of social connection to changes in biological and behavioral responses which may in turn influence health risk. Thus, current evidence supports plausible biological and behavioral mechanisms that explain how social isolation and loneliness ultimately influence health outcomes.
            - paragraph [ref=e261]: The committee identified the increased funding of basic research as key to developing a more robust evidence base on effective assessment, prevention, and intervention strategies for social isolation and loneliness (Goal 1). Specifically, the committee concluded that identifying, prioritizing, and developing ways to translate scientific knowledge about the impacts of social isolation and loneliness on health into effective and efficient clinical and public health interventions first requires a better understanding of how social isolation and loneliness are connected with each other and how they impact health. This includes understanding the mechanisms through which social isolation and loneliness affect health, the risk factors for social isolation and loneliness, and the factors that affect those relationships.
            - paragraph [ref=e263]: "RECOMMENDATION 3-1: Major funders of health research, including the government (e.g., the National Institutes of Health, the Center for Medicare & Medicaid Innovation, and the Patient-Centered Outcomes Research Institute), foundations, and large health plans should fund research to improve the basic scientific understanding of the links between social connection and health, including the study of risk factors and mechanisms."
            - heading "The Current Evidence Base for Interventions" [level=4] [ref=e264]
            - paragraph [ref=e265]: The overall quality of the evidence for specific clinical and public health interventions for social isolation and loneliness in older adults is mixed. In part, this is due to the heterogeneity of older people themselves and the underlying causes of their isolation or loneliness. While there is some evidence for promising approaches, the committee concludes that researchers are only beginning to understand which specific approaches work best for which populations and which risk factors. In particular, the committee emphasizes that different intervention
