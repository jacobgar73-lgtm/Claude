            - paragraph [ref=e524]: "RECOMMENDATION 9-2: Given the public health impact of social isolation and loneliness, the U.S. Department of Health and Human Services should establish and fund a national resource center to centralize evidence, resources, training, and best practices on social isolation and loneliness, including those for older adults and for diverse and at-risk populations."
            - heading "DISSEMINATION AND IMPLEMENTATION" [level=2] [ref=e525]
            - paragraph [ref=e526]: The dissemination and implementation of evidence into regular and effective use is complex because of the multiplicity and varying capacities of health care systems and providers and the diversity of the target audiences. However, such efforts are imperative in order to improve quality of care, outcomes, and population health. Two main challenges exist for the dissemination and implementation of evidence related to the social isolation and loneliness of older adults. First, better dissemination is needed of the evidence of the health impacts. Second, the best practices of implementation science need to be used in order to ensure that health care systems and providers are able to more quickly adopt evidence-based practices. This will be particularly important as the evidence base on the effectiveness of specific interventions improves.
