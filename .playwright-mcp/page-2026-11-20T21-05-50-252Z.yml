            - heading "Defining Social Isolation, Loneliness, and Related Aspects of Social Relationships" [level=3] [ref=f9e463]
            - paragraph [ref=f9e464]:
              - text: The broad, interdisciplinary scientific fields that together form the modern science of social relationships have used a variety of terms (e.g., social isolation, social connection, social networks, social integration, social support, social exclusion, social deprivation, social relationships, loneliness) to refer to empirical phenomena related to social relationships. Although there are important distinctions among these terms concerning what they describe or measure, they are often, incorrectly, used interchangeably. Some of the key terms that will be used throughout this report are presented in
              - link "Box 1-3" [ref=f9e465] [cursor=pointer]:
