            - heading "Social Isolation and Loneliness" [level=4] [ref=f9e496]
            - paragraph [ref=f9e497]:
              - text: Social isolation and loneliness represent distinct phenomena. Social isolation typically refers to the objective lack of (or limited) social contact with others, and it is marked by an individual having few social network ties, having infrequent social contact, or, potentially, living alone. Markers of social isolation objectively and quantitatively establish a dearth of social contact and network size. Loneliness refers to the perception of social isolation or the subjective feeling of being lonely that “occurs when there is a significant mismatch or discrepancy between a person’s actual social relations and his or her needed or desired social relations” (
              - link "Perlman and Peplau, 1998" [ref=f9e498] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref707
              - text: ", p. 571). While loneliness is subjective, there are measurement tools that can help to quantify the degree of loneliness (see"
              - link "Chapter 6" [ref=f9e499] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/8#107
              - text: ). Although those who lack social contact may feel lonely (
              - link "Yildirim and Kocabiyik, 2010" [ref=f9e500] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref990
              - text: ), social isolation and loneliness are often not highly correlated (
              - link "Coyle and Dugan, 2012" [ref=f9e501] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref213
              - text: ;
              - link "Perissinotto and Covinsky, 2014" [ref=f9e502] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref705
              - text: ). Thus, it is important to distinguish between social isolation and loneliness.
            - heading "Related Aspects of Social Relationships" [level=4] [ref=f9e503]
            - paragraph [ref=f9e504]:
              - text: “Social relationships” is arguably the most common term for the connections and intersections among human beings, and it derives from and is employed in broader common usage. The term “social networks” has been used for some time as a similarly broad rubric for the connections among human beings and also other creatures, but it is also used more specifically to refer to the structure and way of analyzing relationship data (
              - link "Scott, 1988" [ref=f9e505] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref803
              - text: ).
              - link "Berkman and Syme (1979)" [ref=f9e506] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref76
              - text: documented the powerful impact of social relationships on all-cause mortality and hence life expectancy, using the terms “social networks” and also “social integration” to denote the broad pattern of social relationships that they were examining; these terms are now part of the concept of social isolation. Beginning before the Berkman and Syme study and continuing over the succeeding four decades, the study of social relationships and health came to focus on social support. Social support is defined as the actual or perceived availability of resources (e.g., informational, tangible, emotional) from others, typically one’s social network (
              - link "Cohen and Wills, 1985" [ref=f9e507] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref188
              - text: ). While each of these terms used to describe social relationships have been linked to important health outcomes, they are not highly correlated, suggesting that each may influence health through different pathways (
              - link "Cohen et al., 2000" [ref=f9e508] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref190
              - text: ). Thus, the literature often refers to organizing themes—the structure, functions, and quality of our social relationships—that categorize the broader class of terms that have been termed social relationships by sociologists and epidemiologists or social connection by psychologists (
              - link "Berkman et al., 2000" [ref=f9e509] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref77
              - text: ;
              - link "Holt-Lunstad, 2018b" [ref=f9e510] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref440
              - text: ;
              - link "Holt-Lunstad et al., 2017" [ref=f9e511] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref445
              - text: ;
              - link "House et al., 1988" [ref=f9e512] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref455
              - text: ). “Social connection” is an umbrella term that some have proposed using to encompass the different conceptual and measurement approaches represented
        - generic [ref=f9e513]:
