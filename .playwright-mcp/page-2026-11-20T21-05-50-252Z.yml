          - generic [ref=f9e129]:
            - heading [level=2] [ref=f9e130]:
              - generic "19" [ref=f9e131]:
                - link "STUDY CONTEXT" [ref=f9e132] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/1#content-toc_pz15-4
            - paragraph [ref=f9e133]:
              - text: A systematic and rigorous science of social relationships and their consequences, especially in terms of health, emerged in the latter part of the 20th century as part of a broader recognition of the role of social determinants of health. By the beginning of the 21st century, several aspects of social relationships were being studied systematically in research and identified as potential influences on human health. Only recently have the adverse health effects of social isolation and loneliness received public attention nationally and internationally through governmental initiatives, the work of nonprofit organizations, and mass media coverage (
              - link "Anderson and Thayer, 2018" [ref=f9e134] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref30
              - text: ;
              - link "Brody, 2017" [ref=f9e135] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref112
              - text: ;
              - link "DiJulio et al., 2018" [ref=f9e136] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref253
              - text: ;
              - link "Frank, 2018" [ref=f9e137] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref310
              - text: ;
              - link "Hafner, 2016" [ref=f9e138] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref381
              - text: ;
              - link "Khullar, 2016" [ref=f9e139] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref525
              - text: ). For example, in January 2018, Theresa May, prime minister of the United Kingdom, established and appointed a Minister of Loneliness to develop policies for both measuring and reducing loneliness (
              - link "Yeginsu, 2018" [ref=f9e140] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref989
              - text: ).
            - paragraph [ref=f9e141]: In his keynote address for the Accreditation Council for Graduate Medical Education (ACGME) 2019 Annual Educational Conference, Vivek Murthy, the 19th Surgeon General of the United States, spoke of an “epidemic of loneliness” that he recognized during his tenure as Surgeon General, stating,
            - paragraph [ref=f9e143]:
              - text: I see [loneliness] actually as a primary concern, not just a health concern but as a concern as a society. . . . While the negative impact of loneliness cannot be denied, the treatment can be relatively simple. Part of treating loneliness is creating moments for genuine human interaction, which can be achieved on several levels. (
              - link "ACGME, 2019" [ref=f9e144] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref11
              - text: )
            - heading "Prevalence of Social Isolation and Loneliness" [level=3] [ref=f9e145]
            - paragraph [ref=f9e146]: "Understanding the prevalence of social isolation and loneliness is important in two ways. First, the population health impact of any risk factor is a function of the strength of its impact and its prevalence in a population. Second, whether a risk factor is becoming more or less prevalent is an indicator of whether its importance for population health is waxing or waning. However, it is very difficult to measure social isolation or loneliness in any population or to ascertain the degree of increase or decrease. A range of estimates have been made for the prevalence of social isolation and loneliness among different segments of the adult population in the United States. For example:"
            - list [ref=f9e147]:
              - listitem [ref=f9e148]:
                - text: Data from the National Health and Aging Trends Study found that 24 percent of community-dwelling adults aged 65 and older in the United States were categorized as being socially isolated and 4 percent were severely socially isolated (
                - link "Cudjoe et al., 2020" [ref=f9e149] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref224
                - text: );
              - listitem [ref=f9e150]:
                - text: A 2012 study by Perissinotto and colleagues found that 43 percent of adults aged 60 and older reported feeling lonely. Furthermore, among those who reported at least one symptom of loneliness, 13 percent reported the symptom as occurring “often” (
                - link "Perissinotto et al., 2012" [ref=f9e151] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref706
                - text: );
        - generic [ref=f9e152]:
          - generic [ref=f9e155]:
            - generic [ref=f9e156]:
              - generic [ref=f9e157]: Page 20
              - generic [ref=f9e158]:
                - generic:
                  - link "Share this page" [ref=f9e159] [cursor=pointer]:
                    - /url: "#"
                  - link "Cite this page" [ref=f9e162] [cursor=pointer]:
                    - /url: "#"
            - generic [ref=f9e166]:
              - strong [ref=f9e167]: "Suggested Citation:"
              - text: "\"1 Introduction.\" National Academies of Sciences, Engineering, and Medicine. 2020."
              - emphasis [ref=f9e168]: "Social Isolation and Loneliness in Older Adults: Opportunities for the Health Care System"
              - text: ". Washington, DC: The National Academies Press. doi: 10.17226/25663."
              - generic [ref=f9e169] [cursor=pointer]
          - generic [ref=f9e172]:
            - list [ref=f9e173]:
              - listitem [ref=f9e174]:
                - generic "20" [ref=f9e175]:
                  - text: A survey by the AARP Foundation found that more than one-third (35 percent) of adults aged 45 and older in the United States report feeling lonely (
                  - link "Anderson and Thayer, 2018" [ref=f9e176] [cursor=pointer]:
                    - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref30
                  - text: );
              - listitem [ref=f9e177]:
                - text: A 2018 survey by the Kaiser Family Foundation found that “more than a fifth of adults [aged 18 and older] in the United States (22 percent) . . . say they often or always feel lonely, feel that they lack companionship, feel left out, or feel isolated from others” (
                - link "DiJulio et al., 2018" [ref=f9e178] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref253
                - text: );
              - listitem [ref=f9e179]:
                - text: A study by
                - link "Hawkley and colleagues (2017)" [ref=f9e180] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref405
                - text: using data from the National Social Life, Health, and Aging Project found that 19 percent of adults aged 62–91 report frequent loneliness (with an additional 29 percent reporting occasional loneliness); and
              - listitem [ref=f9e181]:
                - text: A study by Cigna of adults aged 18 and older found that 46 percent reported “sometimes or always feeling alone” (
                - link "Cigna/Ipsos, 2018" [ref=f9e182] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref182
                - text: ).
            - paragraph [ref=f9e183]:
              - text: Depending on how social isolation or loneliness is measured, the demographic trends contributing to it may include an increase in the number of people living alone, decreased marriage rates, higher rates of childlessness, or decreased community involvement (e.g., volunteerism, religious affiliation) (
              - link "Holt-Lunstad, 2018b" [ref=f9e184] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref440
              - text: ;
              - link "Putnam, 2001" [ref=f9e185] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref738
              - text: ). Social isolation and loneliness may occur unequally across age groups, including within the group of adults 50 years of age and older who are the focus of this report. Furthermore, the oldest adults may not be the most isolated or lonely. For example, the 2018 survey by the Kaiser Family Foundation found that 59 percent of the respondents who reported feeling lonely were under age 50 (
              - link "DiJulio et al., 2018" [ref=f9e186] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref253
              - text: ); the Cigna study found that adults aged 18–22 were the loneliest, and that loneliness decreased with age (
              - link "Cigna/Ipsos, 2018" [ref=f9e187] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref182
              - text: ); and a study by
              - link "Hawkley and colleagues (2019)" [ref=f9e188] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref406
              - text: found that “loneliness decreased with age through the early 70s, after which it increased” (p. 1144).
            - paragraph [ref=f9e189]:
              - text: Aside from looking for differences among various age segments of the adult population, several studies have examined whether there are variations in the prevalence of social isolation or loneliness among subsets of adults related to demographic factors such as socioeconomic status, race and ethnicity, gender, educational status, employment status, and marital status. Several studies have found that those who report feeling lonely are more likely than others to report lower incomes and assets, having poorer health, and not being married (
              - link "Anderson and Thayer, 2018" [ref=f9e190] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref30
              - text: ;
              - link "DiJulio et al., 2018" [ref=f9e191] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref253
              - text: ;
              - link "Hawkley et al., 2017" [ref=f9e192] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref405
              - text: ). According to the study from
              - link "Hawkley and colleagues (2017)" [ref=f9e193] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref405
              - text: ", “loneliness is not significantly more prevalent in the oldest old adults, nor in minority groups relative to whites, nor in women relative to men” (p. 6) and"
              - link "Anderson and Thayer (2018)" [ref=f9e194] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref30
              - text: found that individuals who identify as lesbian, gay, bisexual, transgender, and questioning (or queer) (LGBTQ) are more likely to say they are lonely.
              - link "Cudjoe and colleagues (2020)" [ref=f9e195] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref224
              - text: found that “being unmarried, male, having low education, and low income were all independently associated with social isolation” (p. 107). They further found that “Black and Hispanic older adults had lower odds of social isolation compared with white older adults” (p. 107).
