            - paragraph [ref=f9e295]:
              - text: The Committee on the Health and Medical Dimensions of Social Isolation and Loneliness in Older Adults consisted of 15 members with expertise in bio-informatics, economics, epidemiology, geriatrics, health care, health care administration, medicine, nursing, psychiatry, psychology, public health, rural health, social work, and sociology. (See
