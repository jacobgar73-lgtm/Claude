          - generic [ref=f9e216]:
            - paragraph [ref=f9e217]: Differences in findings among many studies on the prevalence of social isolation and loneliness may be due, in part, to the challenges of defining and measuring social isolation and loneliness, including the use of different measures to assess different aspects of social isolation and loneliness in various groups that may differ by various demographic factors. Despite the variance in measurement, there are clearly a vast number of people who are socially isolated or lonely. Furthermore, the implications of these findings for physical or mental health, morbidity, and mortality underscore the urgency surrounding these issues and render them topics of highest concern to both public health and clinical health care.
            - heading [level=2] [ref=f9e218]:
              - link "CHARGE TO THE COMMITTEE" [ref=f9e219] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/1#content-toc_pz15-5
            - paragraph [ref=f9e220]:
              - text: With support from the AARP Foundation, the National Academies of Sciences, Engineering, and Medicine (the National Academies) formed the Committee on the Health and Medical Dimensions of Social Isolation and Loneliness in Older Adults in fall 2018. The committee’s charge essentially consisted of two parts. First, the committee was asked to examine how social isolation and loneliness affect health and quality of life in adults aged 50 and older, particularly among low-income, underserved, and vulnerable subpopulations. Second, the committee was charged to identify and recommend opportunities specifically for clinical settings of health care to help reduce the incidence and adverse health impacts of social isolation and loneliness (such as clinical tools and methodologies, professional education, and public awareness) and to examine avenues for translation and dissemination of information targeted to health care practitioners (see
              - link "Box 1-1" [ref=f9e221] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/3#chapter01_pADo
              - text: ).
            - paragraph [ref=f9e222]:
              - text: The committee was asked to focus on adults aged 50 and older. Social connections are considered to be a fundamental human need and thus are vital across the lifespan. The committee acknowledges the importance of social connection at all ages and recognizes that social processes at earlier ages influence the trajectory of risk as one ages. For example, there is evidence that social disruptions (e.g., adverse childhood experiences) at early ages can place individuals on a worse health trajectory (
              - link "Anda et al., 2006" [ref=f9e223] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref26
              - text: ;
              - link "Uchino, 2009a" [ref=f9e224] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref910
              - text: ). However, for the purposes of this study and the specific task, the committee did not examine the evidence base related to the health impacts on younger generations or interventions aimed at those populations. Furthermore, the committee notes that studies of both the health impacts of social isolation or loneliness and of potential interventions also often include different segments of the population over age 50, which can make comparisons across studies challenging.
            - paragraph [ref=f9e225]: While this report focuses on the specific role of the health care system (and the role of clinicians and clinical care in particular), the committee emphasizes that the health care system alone cannot solve all of the challenges related to social isolation and loneliness; rather, the health care system needs to connect with the
        - generic [ref=f9e226]:
