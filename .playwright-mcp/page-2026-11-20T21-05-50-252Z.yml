            - complementary [ref=f9e466]:
              - heading "BOX 1-3 Key Definitions" [level=5] [ref=f9e467]
              - paragraph [ref=f9e469]: "Loneliness: the perception of social isolation or the subjective feeling of being lonely."
              - paragraph [ref=f9e470]: "Mediators: also known as mechanisms or pathways; the factors that help explain how social isolation or loneliness affects health outcomes."
              - paragraph [ref=f9e471]: "Moderators: the factors that can influence the magnitude or direction of the effect of social isolation or loneliness on health."
              - paragraph [ref=f9e472]: "Social connection: an umbrella term that encompasses the structural, functional, and quality aspects of how individuals connect to each other."
              - paragraph [ref=f9e473]: "Social isolation: the objective lack of (or limited) social contact with others."
              - paragraph [ref=f9e474]: "Social support: the actual or perceived availability of resources (e.g., informational, tangible, emotional) from others, typically one’s social network."
