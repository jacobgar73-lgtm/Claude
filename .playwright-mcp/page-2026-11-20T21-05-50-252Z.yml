          - generic [ref=f9e50]:
            - heading [level=1] [ref=f9e51]:
              - generic "17" [ref=f9e52]:
                - link "1 Introduction" [ref=f9e53] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/1#content-toc_pz15-3
            - generic [ref=f9e54]:
              - paragraph [ref=f9e55]: A social instinct is implanted in all [people] by nature. . . .
              - paragraph [ref=f9e56]:
                - text: —Aristotle, Politics, 350 B.C.E.,
                - link "Jowett (2009)" [ref=f9e57] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref512
              - paragraph [ref=f9e58]: The scientific evidence is convincing. Strong social ties are good for one’s health.
              - paragraph [ref=f9e59]:
                - text: —
                - link "Lubben (2017)" [ref=f9e60] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref581
            - paragraph [ref=f9e61]:
              - text: Social isolation (the objective state of having few social relationships or infrequent social contact with others) and loneliness (a subjective feeling of being isolated) are serious yet underappreciated public health risks that affect a significant portion of the population. Approximately one-quarter (24 percent) of community-dwelling Americans aged 65 and older are considered to be socially isolated, and a significant proportion of adults in the United States report feeling lonely (35 percent of adults aged 45 and older and 43 percent of adults aged 60 and older) (
              - link "Anderson and Thayer, 2018" [ref=f9e62] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref30
              - text: ;
              - link "Cudjoe et al., 2020" [ref=f9e63] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref224
              - text: ;
              - link "Perissinotto et al., 2012" [ref=f9e64] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref706
              - text: "). In spite of some challenges related to the measurement of social isolation and loneliness, current evidence suggests that many older adults are socially isolated or lonely (or both) in ways that put their health at risk. For example:"
            - list [ref=f9e65]:
              - listitem [ref=f9e66]:
                - text: Social isolation significantly increases a person’s risk of mortality from all causes, a risk that may rival the risks of smoking, obesity, and physical activity (
                - link "Holt-Lunstad et al., 2017" [ref=f9e67] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref445
                - text: );
              - listitem [ref=f9e68]:
                - text: Being socially connected in a variety of ways is associated with having a 50 percent greater likelihood of survival, with some indicators of social integration being associated with a 91 percent greater likelihood of survival (
                - link "Holt-Lunstad et al., 2010" [ref=f9e69] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref443
                - text: );
        - generic [ref=f9e70]:
          - generic [ref=f9e73]:
            - generic [ref=f9e74]:
              - generic [ref=f9e75]: Page 18
              - generic [ref=f9e76]:
                - generic:
                  - link "Share this page" [ref=f9e77] [cursor=pointer]:
                    - /url: "#"
                  - link "Cite this page" [ref=f9e80] [cursor=pointer]:
                    - /url: "#"
            - generic [ref=f9e84]:
              - strong [ref=f9e85]: "Suggested Citation:"
              - text: "\"1 Introduction.\" National Academies of Sciences, Engineering, and Medicine. 2020."
              - emphasis [ref=f9e86]: "Social Isolation and Loneliness in Older Adults: Opportunities for the Health Care System"
              - text: ". Washington, DC: The National Academies Press. doi: 10.17226/25663."
              - generic [ref=f9e87] [cursor=pointer]
          - generic [ref=f9e90]:
            - list [ref=f9e91]:
              - listitem [ref=f9e92]:
                - generic "18" [ref=f9e93]:
                  - text: Social isolation has been associated with a 29 percent increased all-cause risk for mortality and a 25 percent increased risk for cancer mortality (
                  - link "Fleisch Marcus et al., 2017" [ref=f9e94] [cursor=pointer]:
                    - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref300
                  - text: ;
                  - link "Holt-Lunstad et al., 2015" [ref=f9e95] [cursor=pointer]:
                    - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref444
                  - text: );
              - listitem [ref=f9e96]:
                - text: Loneliness has been associated with higher rates of clinically significant depression, anxiety, and suicidal ideation (
                - link "Beutel et al., 2017" [ref=f9e97] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref80
                - text: );
              - listitem [ref=f9e98]:
                - text: Loneliness has been associated with a 59 percent increased risk of functional decline and 45 percent increased risk of death (
                - link "Perissinotto et al., 2012" [ref=f9e99] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref706
                - text: );
              - listitem [ref=f9e100]:
                - text: Poor social relationships (characterized by social isolation or loneliness) have been associated with a 29 percent increased risk of incident coronary heart disease and a 32 percent increased risk of stroke (
                - link "Valtorta et al., 2016a" [ref=f9e101] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref925
                - text: );
              - listitem [ref=f9e102]:
                - text: Loneliness among heart failure patients has been associated with a nearly four times increased risk of death, 68 percent increased risk of hospitalization, and 57 percent increased risk of emergency department visits (
                - link "Manemann et al., 2018" [ref=f9e103] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref598
                - text: ); and
              - listitem [ref=f9e104]:
                - text: Social isolation has been associated with an approximately 50 percent increased risk of developing dementia (
                - link "Kuiper et al., 2015" [ref=f9e105] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref547
                - text: ;
                - link "Penninkilampi et al., 2018" [ref=f9e106] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref704
                - text: ).
            - paragraph [ref=f9e107]: Understanding the full scope and complexity of the influence of social relationships on health is challenging. In addition to the absolute number or extent of social relationships, the quality of such relationships is also important for their impact on health. As such, two aspects of social relationships, social isolation and loneliness, have become most prominent in the scientific literature. While both social isolation and loneliness can affect health throughout the life course, this report focuses specifically on the health and medical impacts of social isolation and loneliness among adults aged 50 and older. Of note, it is incorrect to assume that all older people are isolated or lonely. Rather, older adults are at increased risk for social isolation and loneliness because they are more likely to face predisposing factors such as living alone, the loss of family or friends, chronic illness, and sensory impairments. Over a life course, social isolation and loneliness may be episodic or chronic, depending on an individual’s circumstances and perceptions.
            - paragraph [ref=f9e108]: Many approaches have been taken to improve social connections for individuals who are socially isolated or lonely, but finding opportunities to intervene may be most challenging for those who are at highest risk. For example, people who do not have consistent interactions with others (e.g., have unstable housing, do not belong to any social or religious groups, or do not have significant personal relationships) may never be identified in their own communities. However, nearly all persons who are 50 years of age or older interact with the health care system in some way, regardless of where they fall on the social isolation or loneliness continuum, and so this interaction may serve as a touchpoint to identify those who are isolated or lonely. Therefore, this report focuses on the role of the health care system as a key and relatively untapped partner in efforts to identify, prevent, and mitigate the adverse health impacts of social isolation and loneliness in older adults.
