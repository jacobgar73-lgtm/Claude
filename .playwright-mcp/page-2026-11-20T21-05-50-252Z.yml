                - superscript [ref=f9e570]:
                  - link "1" [ref=f9e571] [cursor=pointer]:
                    - /url: https://www.nationalacademies.org/read/25663/chapter/3#chapter01_pz49-6
            - heading "The Health Care System and Its Providers" [level=3] [ref=f9e572]
            - paragraph [ref=f9e573]: For the purposes of this study, the committee examined the potential role of the formal health care system and settings where health care services are provided in reducing the impacts of social isolation and loneliness in older adults. The committee considered health care settings broadly to include not just hospital and professional offices, but also other community-based settings where clinical health care services are provided (e.g., homes, long-term care settings). In accordance with discussions with the sponsor in open session at the committee’s first meeting, the committee agreed to consider the settings of care broadly, but to focus on the provision of clinical care by qualified clinicians and health care workers (not including family caregivers). Therefore, the committee used the lens of the health care system itself on the role of health care professionals (e.g., nurses, physicians, social workers), direct care workers (e.g., home health aides, nurse aides, personal care aides), and others involved in the delivery of health care (e.g., community health workers, health care administrators, health information technology professionals). While the committee recognizes the vital importance of family caregivers (the family, friends, and others who provide care, sometimes called informal caregivers) to the delivery of health care as well as their role in mitigating the social isolation and loneliness of their family members, the committee and sponsor agreed that the focus for this study was to gain a comprehensive understanding of how social isolation and loneliness affect the individual and then explore the role of the formal health care system as described above.
            - paragraph [ref=f9e574]: The committee also limited its examination largely to literature from the United States. The committee based this approach not only on the likely differences among different countries that can affect social isolation and loneliness (e.g., societal norms, cultural expectations, and family structures), but also on the fact that the health care systems in other countries are markedly different from the U.S. health care system, and could make comparisons of clinical approaches quite challenging. However, the committee did review and include notable examples from other countries wherever relevant.
            - paragraph [ref=f9e575]: Finally, the committee considered general public health principles, including connection to the community and other public health partners, to be considered a part of comprehensive clinical care, especially given that the Statement of Task calls for the committee to consider “opportunities that can be incorporated into health care environments” (e.g., education, tools, public awareness). While the
            - paragraph [ref=f9e576]: ___________________
            - paragraph [ref=f9e577]:
              - superscript [ref=f9e578]:
                - link "1" [ref=f9e579] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/3#chapter01_ADBv
              - text: While social integration can describe high social connection, low scores on measures of social integration (e.g., on the Berkman–Syme Social Network Index) are frequently used as an indication of social isolation. Thus, the term “social isolation” will also be used to represent these data.
