            - paragraph [ref=f9e436]: Finally, all of these relationships fit within a typical ecological model of health wherein factors contributing to social isolation and loneliness at the individual level are also potentially affected by the broader contextual factors at the levels of the community and society. Factors that influence social isolation and loneliness at the community level may include factors such as availability of transportation, broadband access, natural disasters, gentrification, and housing displacement. Factors that influence social isolation and loneliness at the society level may, for example, include racism, ageism, changes in family structure (e.g., lower rates of intergenerational living, higher rates of divorce and childlessness), trends in use of technology, and broader laws and policies that may affect social isolation and loneliness.
            - paragraph [ref=f9e437]:
              - text: These influences at the level of the community and society are key to understanding risk for social isolation and loneliness and often have a reciprocal relationship with risk and protective factors at the individual level. For example, a key lifestyle feature of Blue Zones (geographic areas characterized by populations with low levels of chronic disease and long lifespans) is social connection. This may be in part due to how the overall social norms of these communities impact individual-level factors for social isolation and loneliness; Blue Zones are often characterized by living in proximity to one’s family, belonging to a faith-based community, and supporting healthy behaviors (e.g., healthy diets and exercise). These ideas are captured in the person-environment fit theory which “focuses on the interaction between the characteristics of the individual and the environment, whereby the individual not only influences his or her environment, but the environment also affects the individual” (
              - link "Holmbeck et al., 2008" [ref=f9e438] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref436
              - text: ", p. 33). This may be particularly important for individuals with disabilities for whom their social and physical environments influence participation, engagement, inclusion, and social relationships."
              - link "Chapter 4" [ref=f9e439] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/6#63
              - text: provides some insight for the contextual factors at the levels of the community and society, but an extensive discussion of all of these broader concepts and the bio-psycho-social model of health, is beyond the scope of this report.
