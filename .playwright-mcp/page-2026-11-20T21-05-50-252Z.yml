            - paragraph [ref=f9e402]:
              - text: In this report and more generally, variables or boxes that intervene between a presumed causal factor and any subsequent variables or boxes that the cause is presumed to affect are termed mediators of that causal effect. Mediators (i.e., mechanisms or pathways) are the factors that help explain how social isolation or loneliness affects health outcomes. Most notably, variables in the box labeled pathways are hypothesized to mediate the effect of risk factors or social connections on health impacts, which in turn usually mediate these effects on mortality. Any of the variables in
              - link "Figure 1-1" [ref=f9e403] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/3#chapter01_pz44-2
              - text: ", as well as other variables not specified there, may also act as moderators of any of the relationships between variables in the framework. Moderators are the factors that can influence the magnitude or direction of the effect of social isolation or loneliness on health. For example, the existence, nature, or strength of any empirical relationship hypothesized in"
              - link "Figure 1-1" [ref=f9e404] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/3#chapter01_pz44-2
              - text: may vary as a function of age, sex/gender, race/ethnicity, socioeconomic position, geographic location, or pre-existing health status.
            - paragraph [ref=f9e405]:
              - text: Many of the relationships in the model are potentially bi-directional, as indicated by the thinner arrows. For example, social isolation and loneliness do causally affect health, but they, in turn, may also be affected by health status. That is, a chronic condition, for example, can be both a risk factor for or a consequence of social isolation or loneliness. The committee recognizes that separating discussions of health impacts (see
              - link "Chapter 3" [ref=f9e406] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/5#49
              - text: ) from risk and protective factors (see
              - link "Chapter 4" [ref=f9e407] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/6#63
              - text: ) can be challenging and confusing given that the same health condition is often discussed in both chapters, albeit for different reasons. Similarly, factors that mediate the relationship between social isolation/loneliness and health can also serve as moderators of those relationships. Therefore, the committee emphasizes
