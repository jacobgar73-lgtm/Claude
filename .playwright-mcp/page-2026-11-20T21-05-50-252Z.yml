            - paragraph [ref=f9e601]: committee’s ultimate recommendations are not all explicitly directed to health care professionals and other health care workers, the committee asserts that its recommendations are the ones that would be most helpful in reaching the ultimate goal of improving the role of individuals involved in clinical care in particular to help mitigate the negative health impacts of social isolation and loneliness.
            - heading "Identifying Populations at Risk" [level=3] [ref=f9e602]
            - paragraph [ref=f9e603]:
              - text: Pursuant to its charge, the committee primarily focused its efforts on addressing the health and medical dimensions of loneliness and social isolation as they pertain to adults aged 50 and older. The committee’s work was necessarily limited by the available research on this population. Also in response to the charge, the committee sought to include relevant research pertaining to low-income, underserved, or vulnerable populations. To address these subpopulations of older adults, the committee included available research on specific populations as defined by race, geographic area (e.g., rural versus urban), immigration status, sexual orientation, and other characteristics. Although the research on many of these subpopulations is sparse, examinations of studies focusing on these subpopulations are included throughout the report as part of the evidentiary data for each topic area. A separate section specifically addressing particular subpopulations (i.e., gay, lesbian, and bisexual populations; minorities; immigrants; and victims of elder abuse) is included in
              - link "Chapters 4" [ref=f9e604] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/6#63
              - text: and
              - link "5" [ref=f9e605] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/7#91
              - text: . However, the committee emphasizes that the literature base specific to at-risk populations is quite sparse, and much more research is needed to determine the risks, impacts, and appropriate interventions for a variety of at-risk subpopulations.
            - heading "Quality of Available Evidence" [level=3] [ref=f9e606]
            - paragraph [ref=f9e607]:
              - text: A significant and robust literature demonstrates the impact of social isolation and loneliness on health and well-being (see
              - link "Chapters 2" [ref=f9e608] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/4#35
              - text: and
              - link "3" [ref=f9e609] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/5#49
              - text: ). However, the literature on effective interventions, particularly for the role of the health care system, is less robust. The existing studies of interventions vary in their terminology, measures, and measured outcomes. While this variability made comparing the studies and their overall conclusions quite challenging for the committee, the variability can also be a strength in the sense that it makes it possible to look for convergent validity (i.e., robustness of the empirical relationships among conceptual variables even in the face of some variation in measures and study designs; see
              - link "Lykken, 1968" [ref=f9e610] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref591
              - text: ) in establishing the effect of social isolation and loneliness on health and well-being.
            - paragraph [ref=f9e611]:
              - text: The committee prioritized the available literature according to known principles of evidence-based health research intended to reduce the risk of bias affecting study conclusions (
              - link "Podsakoff et al., 2003" [ref=f9e612] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/13#backmatter01_ref725
              - text: ). Important factors include how participants are allocated to different types of interventions, the comparability of
