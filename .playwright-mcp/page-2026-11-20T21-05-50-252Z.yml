                - text: ", social connection encompasses the variety of ways one can connect to others socially—through physical, behavioral, social–cognitive, and emotional channels. The extent to which an individual is socially connected takes a multifactorial approach, including (1) [structural aspects] connections to others via the existence of relationships and their roles; (2) [functional aspects] a sense of connection that results from actual or perceived support or inclusion; and (3) [qualitative aspects] the sense of connection to others that is based on positive and negative qualities."
                - link "Figure 1-2" [ref=f9e544] [cursor=pointer]:
                  - /url: https://www.nationalacademies.org/read/25663/chapter/3#chapter01_AxCC
                - text: shows the three categories of indicators of social connection (i.e., structural, functional, and quality indicators) and provides examples of such indicators.
            - paragraph [ref=f9e545]: When considering risk factors and protective factors for social isolation and loneliness, having indicators of high social connection is typically considered protective while having indicators of low social connection is typically considered detrimental. Social isolation and loneliness are examples of low social connection, with social isolation being a structural aspect and loneliness a functional aspect. Some indicators of social connection are more stable than others, and the acute or chronic nature of these indicators will influence the degree of risk or protection.
            - paragraph [ref=f9e546]: The committee recognizes that the literature on social isolation and loneliness uses all of these terms. To describe the evidence base as accurately as possible, when the evidence does not differentiate among or combines several related terms, this report uses the term “social connection” to refer to the various structural, functional, and quality aspects of social relationships. This report uses
