              - heading "BOX 1-1 Statement of Task" [level=5] [ref=f9e248]
              - paragraph [ref=f9e250]: "An ad hoc committee under the auspices of the National Academies of Sciences, Engineering, and Medicine will examine how isolation and loneliness impact health outcomes in older adults aged 50 and older, particularly among low-income, underserved, and vulnerable subpopulations. The committee will:"
              - list [ref=f9e251]:
                - listitem [ref=f9e252]:
                  - text: "Summarize and examine the evidence that social isolation and loneliness predict poor health outcomes and increase a person’s risk for premature morbidity, including evidence for:"
                  - list [ref=f9e253]:
                    - listitem [ref=f9e254]: Predictors of social isolation and loneliness;
                    - listitem [ref=f9e255]: Impact of social isolation and loneliness on the cognitive, emotional, medical, and quality-of-life outcomes; and
                    - listitem [ref=f9e256]: Factors that moderate and mediate the links between social isolation/loneliness and health outcomes.
                - listitem [ref=f9e257]: Explore how social isolation and loneliness affect health care access and utilization.
                - listitem [ref=f9e258]:
                  - text: "Make evidence-based recommendations on translating research into practice within the clinical setting that could facilitate progress in reducing the incidence and adverse health impacts of social isolation and loneliness among the low-income 50+ population. These recommendations will focus on the following issues:"
                  - list [ref=f9e259]:
                    - listitem [ref=f9e260]:
                      - text: Opportunities for the identification of, prevention of, and interventions for social isolation and loneliness that can be incorporated into clinical environments
                      - generic [ref=f9e261]: that may include
                      - text: social and environmental programs; the education of health care professionals; tools and methodologies that can be used in clinical settings; and public awareness.
                    - listitem [ref=f9e262]: Current financing for social isolation and loneliness interventions and future opportunities.
                - listitem [ref=f9e263]: Examine avenues for translation and dissemination of new findings and communication of new information targeting health care practitioners.
            - paragraph [ref=f9e264]: broader public health and social care communities. Furthermore, the committee recognizes that in the larger context of addressing social isolation and loneliness, the most effective interventions may not require the participation of the health care system. However, the committee argues that this does not mean that the health care system should not strive to help improve the health and well-being of those who suffer the adverse health impacts of social isolation and loneliness. In fact, health care providers may be in the best position to identify individuals who are at highest risk for social isolation or loneliness—individuals for whom the health care system may be their only point of contact with their broader community. In this way, the health care system can help those individuals to connect
