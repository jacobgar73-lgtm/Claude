            - paragraph [ref=f9e637]:
              - text: The work of the current committee reinforces, extends, and elaborates on the work of prior National Academies committees.
              - link "Chapter 2" [ref=f9e638] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/4#35
              - text: examines the history and context of how social isolation in particular (and loneliness to a lesser extent) came to be recognized as a factor influencing mortality and how social support came to be recognized as a protective factor.
              - link "Chapter 3" [ref=f9e639] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/5#49
              - text: summarizes the evidence base for the impacts of social isolation and loneliness on morbidity and quality of life, while
              - link "Chapter 4" [ref=f9e640] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/6#63
              - text: summarizes the evidence base for the factors that put people at risk for social isolation and loneliness.
              - link "Chapter 5" [ref=f9e641] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/7#91
              - text: discusses the moderators and mediators of the relationships of social isolation and loneliness with health.
              - link "Chapter 6" [ref=f9e642] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/8#107
              - text: presents a brief overview of the tools used for measurement and assessment in research settings as well as of the use of information technology to identify individuals at risk for social isolation or loneliness.
              - link "Chapter 7" [ref=f9e643] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/9#123
              - text: discusses the role of the health care system specifically in addressing social isolation and loneliness.
              - link "Chapter 8" [ref=f9e644] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/10#147
              - text: considers the importance of education and training of the general public and the health care workforce, particularly in raising awareness of the health impacts of social isolation and loneliness.
              - link "Chapter 9" [ref=f9e645] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/11#171
              - text: presents an overview of interventions for social isolation and loneliness, focusing on approaches that are most applicable to health care providers and settings.
              - link "Chapter 10" [ref=f9e646] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/12#221
              - text: reflects on the principles of dissemination and implementation in order to explore avenues for translating research into practice. The citations for all chapters have been merged into a single reference list that follows
