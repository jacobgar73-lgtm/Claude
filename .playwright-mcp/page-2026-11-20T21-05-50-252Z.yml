              - text: for the biographies of the committee members.)
            - paragraph [ref=f9e297]:
              - text: A variety of sources informed the committee’s work. The committee met in person five times, and during three of those meetings it held public sessions to obtain input from a broad range of relevant stakeholders, including the sponsor. (See
              - link "Appendix A" [ref=f9e298] [cursor=pointer]:
                - /url: https://www.nationalacademies.org/read/25663/chapter/14#287
              - text: for the public meeting agendas with topics and speakers listed.) In addition, the committee conducted extensive literature reviews, reached out to a variety of public and private stakeholders, and commissioned one paper.
